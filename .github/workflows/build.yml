name: Build app packages

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: dart analyze lib test integration_test test_driver
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true
      - run: go test -race ./...
        working-directory: native
      - run: go test -race -ldflags="-X duanjuapp/native/core.buildAllSources=true" ./...
        working-directory: native

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Install Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;28.2.13676358"
      - name: Configure Android signing
        run: python scripts/configure_signing.py
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: python scripts/build_android.py ${{ matrix.arguments }}
      - name: Remove signing files
        if: always()
        run: python scripts/configure_signing.py --clean
      - name: Publish Android APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v0.2.50" --title "真果鉴 / 红果鉴 v0.2.50" --notes "真果鉴（全站源版）与红果鉴（单站源版）多端独立短剧应用安装包" || true
          gh release upload "v0.2.50" dist/android/* --clobber
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.edition }}-android
          path: dist/android/*
          if-no-files-found: ignore
          retention-days: 14
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Add MinGW64 to PATH
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python scripts/build_windows.py ${{ matrix.arguments }}
      - run: choco install ffmpeg --no-progress -y
      - run: python scripts/smoke_windows.py ${{ matrix.arguments }}
      - name: Publish Windows packages to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v0.2.50" --title "真果鉴 / 红果鉴 v0.2.50" --notes "真果鉴（全站源版）与红果鉴（单站源版）多端独立短剧应用安装包" || true
          gh release upload "v0.2.50" dist/windows/* --clobber
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.edition }}-windows
          path: dist/windows/*
          if-no-files-found: ignore
          retention-days: 14

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: python3 scripts/build_ios.py ${{ matrix.arguments }}
      - name: Publish iOS app to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v0.2.50" --title "真果鉴 / 红果鉴 v0.2.50" --notes "真果鉴（全站源版）与红果鉴（单站源版）多端独立短剧应用安装包" || true
          gh release upload "v0.2.50" dist/ios/* --clobber
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.edition }}-ios-unsigned
          path: dist/ios/*
          if-no-files-found: ignore
          retention-days: 14
